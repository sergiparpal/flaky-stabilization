[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flaky-stabilization"
version = "0.2.1"
description = "Unified Hermes Agent plugin: failure history, flaky detection, CI triage, sandboxed healing with PR flow, bug-report structuring, PII gating, and a local Jira incident index."
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "sergiparpal" }]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4", "ruff>=0.5"]
ocr = ["Pillow>=11.3", "pytesseract>=0.3.13"]

[project.scripts]
# The standalone CLI composition root. Same name as the Hermes subcommand
# (`hermes flaky-stab scan`), so docs and cron shims carry over unchanged.
flaky-stab = "flaky_stabilization.__main__:main"

[tool.setuptools.packages.find]
include = ["flaky_stabilization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not docker and not e2e and not live'"
markers = [
    "docker: requires a reachable Docker daemon (skipped when unavailable)",
    "e2e: requires Docker or installed local Playwright browsers (opt-in only)",
    "live: requires network and credentials (opt-in only, off by default)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Ported legacy test suites are kept verbatim (plan §6.1 porting rule); style
# findings inside them are not ours to fix.
"tests/history/*" = ["E501"]
"tests/detective/*" = ["E501", "B018"]
"tests/pii/*" = ["E501", "E402"]
"tests/bugreport/*" = ["E501"]
"tests/triage/*" = ["E501"]
"tests/incidents/*" = ["E501"]
